# Envoy front proxy for Assignment 3 - PART D.3: ROUND ROBIN + ACTIVE HEALTH CHECKS (failure and recovery)
#
# Only change from envoy.yaml: active health checks on http_replicas (GET /health) and grpc_replicas
# (grpc.health.v1). interval 2 s, timeout 1 s, unhealthy_threshold 2, healthy_threshold 2.
# Expected removal after a stop:  about 2 failed checks = 2 to 4 s (+ up to 1 s timeout).
# Expected return after a restart: about 2 passed checks  = 2 to 4 s after the replica is up.
# Health-check events (eject / add back) are written to stdout as JSON and shipped by Filebeat.
#
# Use:     $env:ENVOY_CONFIG = "part-d-health-checks.yaml"; docker compose up -d envoy
# Restore: Remove-Item Env:ENVOY_CONFIG; docker compose up -d envoy   (back to envoy.yaml, equal round robin)
# No retries are configured on any route.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: http_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 5000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http_ingress
                codec_type: AUTO
                use_remote_address: true        # append the caller's address to X-Forwarded-For
                generate_request_id: true       # create X-Request-ID when the client sent none
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          service: "envoy"
                          listener: "http"
                          message: "Envoy access log"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          route: "%REQ(:PATH)%"
                          protocol: "%PROTOCOL%"
                          status_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          replica: "%RESP(X-REPLICA)%"
                route_config:
                  name: http_route
                  virtual_hosts:
                    - name: petstore_http
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: http_replicas
                            timeout: 5s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: grpc_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 50051 }
      filter_chains:
        - filters:
            # HTTP connection manager (not tcp_proxy): Envoy decodes HTTP/2, so it sees each
            # gRPC call as its own request and picks a replica per call.
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_ingress
                codec_type: HTTP2
                use_remote_address: true
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          service: "envoy"
                          listener: "grpc"
                          message: "Envoy access log"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          route: "%REQ(:PATH)%"
                          protocol: "%PROTOCOL%"
                          status_code: "%RESPONSE_CODE%"
                          grpc_status: "%GRPC_STATUS%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          replica: "%RESP(X-REPLICA)%"
                route_config:
                  name: grpc_route
                  virtual_hosts:
                    - name: petstore_grpc
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: grpc_replicas
                            timeout: 5s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # Comparison only: gRPC through a plain TCP proxy. Envoy cannot see individual calls here,
    # so it balances CONNECTIONS. A client with one channel (one connection) sends every call to
    # the single replica chosen when the connection opened. Not published on the host; the
    # loadgen container reaches it as envoy:50052.
    - name: grpc_tcp_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 50052 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: grpc_tcp
                cluster: grpc_replicas_tcp
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          service: "envoy"
                          listener: "grpc_tcp"
                          message: "Envoy TCP connection closed"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"

  clusters:
    - name: http_replicas
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 2s
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 1s                 # a check that takes longer than 1 s counts as a failure
          interval: 2s                # one check per replica every 2 s
          interval_jitter: 0s
          no_traffic_interval: 2s     # keep checking every 2 s even when the cluster is idle
          unhealthy_threshold: 2      # 2 failed checks in a row  -> replica removed
          healthy_threshold: 2        # 2 passed checks in a row  -> replica added back
          always_log_health_check_failures: true
          event_logger:
            - name: envoy.health_check.event_sinks.file
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.health_check.event_sinks.file.v3.HealthCheckEventFileSink
                event_log_path: /dev/stdout
          http_health_check:
            path: /health
      load_assignment:
        cluster_name: http_replicas
        endpoints:
          - lb_endpoints:
              - endpoint:
                  hostname: A
                  address:
                    socket_address: { address: petstore-observability-app-1, port_value: 5000 }
              - endpoint:
                  hostname: B
                  address:
                    socket_address: { address: petstore-observability-app-2, port_value: 5000 }
              - endpoint:
                  hostname: C
                  address:
                    socket_address: { address: petstore-observability-app-3, port_value: 5000 }

    - name: grpc_replicas
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 2s
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s                 # a check that takes longer than 1 s counts as a failure
          interval: 2s                # one check per replica every 2 s
          interval_jitter: 0s
          no_traffic_interval: 2s     # keep checking every 2 s even when the cluster is idle
          unhealthy_threshold: 2      # 2 failed checks in a row  -> replica removed
          healthy_threshold: 2        # 2 passed checks in a row  -> replica added back
          always_log_health_check_failures: true
          event_logger:
            - name: envoy.health_check.event_sinks.file
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.health_check.event_sinks.file.v3.HealthCheckEventFileSink
                event_log_path: /dev/stdout
          grpc_health_check: {}      # grpc.health.v1.Health/Check, service "" (whole server)
      load_assignment:
        cluster_name: grpc_replicas
        endpoints:
          - lb_endpoints:
              - endpoint:
                  hostname: A
                  address:
                    socket_address: { address: petstore-observability-app-1, port_value: 50051 }
              - endpoint:
                  hostname: B
                  address:
                    socket_address: { address: petstore-observability-app-2, port_value: 50051 }
              - endpoint:
                  hostname: C
                  address:
                    socket_address: { address: petstore-observability-app-3, port_value: 50051 }

    # Comparison only (listener :50052): gRPC through a plain TCP proxy.
    - name: grpc_replicas_tcp
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 2s
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: grpc_replicas_tcp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  hostname: A
                  address:
                    socket_address: { address: petstore-observability-app-1, port_value: 50051 }
              - endpoint:
                  hostname: B
                  address:
                    socket_address: { address: petstore-observability-app-2, port_value: 50051 }
              - endpoint:
                  hostname: C
                  address:
                    socket_address: { address: petstore-observability-app-3, port_value: 50051 }
