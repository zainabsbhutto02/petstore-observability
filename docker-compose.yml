# Fixed project name, so the replica containers are always petstore-observability-app-1/2/3
# (Envoy and Prometheus address them by these names).
name: petstore-observability

services:
  # Assignment 3: three identical replicas (A, B, C) of the application. Each one serves the
  # REST API on :5000 and the gRPC service on :50051 (run_replica.py). No host ports: clients go
  # through Envoy, and Prometheus scrapes each replica directly on the Docker network.
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    deploy:
      replicas: 3
    environment:
      PETSTORE_INJECT_DELAY: "false"
      REPLICA_NAME_PREFIX: petstore-observability-app   # replica_identity.py: app-1 -> A, ...
      # A3 Part D fault: slow down ONE replica (empty = off). Example:
      #   $env:PETSTORE_DELAY_REPLICA = "B"; $env:PETSTORE_DELAY_MS = "200"; docker compose up -d app
      #   Remove-Item Env:PETSTORE_DELAY_*; docker compose up -d app        # restore
      PETSTORE_DELAY_REPLICA: ${PETSTORE_DELAY_REPLICA:-}
      PETSTORE_DELAY_MS: ${PETSTORE_DELAY_MS:-0}
    expose:
      - "5000"
      - "50051"
    labels:
      com.petstore.role: app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - petstore_data:/app/data     # one SQLite file shared by all replicas
    networks:
      - petstore-net
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.31.2
    # envoy/envoy.yaml = Part C equal round robin (default). To run another config from envoy/:
    #   $env:ENVOY_CONFIG = "part-a-a-only.yaml"; docker compose up -d envoy
    #   Remove-Item Env:ENVOY_CONFIG; docker compose up -d envoy      # restore round robin
    command: ["envoy", "-c", "/etc/envoy/configs/${ENVOY_CONFIG:-envoy.yaml}"]
    depends_on:
      - app
    ports:
      - "5000:5000"     # HTTP  (same host port as the A2 REST API)
      - "50051:50051"   # gRPC  (same host port as the A2 gRPC service)
      - "9901:9901"     # admin: /stats/prometheus, /clusters
    volumes:
      - ./envoy:/etc/envoy/configs:ro
    labels:
      com.petstore.role: envoy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - petstore-net
    restart: unless-stopped

  # A3 fixed-rate test client (client/loadgen.py). Not started by "up" (profile "tools");
  # run it on demand, inside the Docker network, against Envoy (the balanced route):
  #   docker compose run --rm loadgen http --rate 20 --duration 60 --label baseline
  # Uses the replica image because it already has grpcio and the generated gRPC code.
  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.app
    profiles: ["tools"]
    entrypoint: ["python", "client/loadgen.py"]
    volumes:
      - ./client:/app/client:ro
      - ./results:/app/results      # one JSON summary per run
    networks:
      - petstore-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - envoy
    ports:
      - "5173:80"
    networks:
      - petstore-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - petstore-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - petstore-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2|configfs|debugfs|devpts|devtmpfs|fusectl|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs|udev|fuse.lxcfs)$
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - petstore-net
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - petstore-net
    mem_limit: 1g
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1536
    ports:
      - "5601:5601"
    networks:
      - petstore-net
    mem_limit: 2g
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    depends_on:
      - elasticsearch
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./monitoring/filebeat/petstore-template.json:/usr/share/filebeat/petstore-template.json:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data   # A3: keep the registry (read positions) across recreates
    networks:
      - petstore-net
    mem_limit: 128m
    restart: unless-stopped

volumes:
  petstore_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  filebeat_data:

networks:
  petstore-net:
    driver: bridge