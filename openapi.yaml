openapi: 3.0.3
info:
  title: Paws & Cart Pet Store API
  version: 1.0.0
  description: >
    Flask REST API for the Paws & Cart pet store. Products and orders are stored
    in SQLite. Every response carries an X-Request-ID header (echoed from the
    request, or generated by the server) that appears in the structured logs.
servers:
  - url: http://localhost:5000
    description: Backend directly
  - url: http://localhost:5173
    description: Through the nginx frontend proxy (health, products, orders only)

tags:
  - name: system
  - name: products
  - name: orders

paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: The backend process is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                service: pet-store
                status: healthy

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      operationId: getMetrics
      description: Scraped by Prometheus. Not proxied through nginx.
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

  /products:
    get:
      tags: [products]
      summary: List all products with current stock
      operationId: listProducts
      responses:
        "200":
          description: All products ordered by id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /orders:
    get:
      tags: [orders]
      summary: List all orders
      operationId: listOrders
      responses:
        "200":
          description: All orders ordered by id, including each product's name.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags: [orders]
      summary: Create a pending order and reduce stock
      operationId: createOrder
      description: >
        Safe to retry when an Idempotency-Key header is sent. The first request
        with a key creates the order; any repeat with the same key and the same
        body returns that same order (marked Idempotent-Replayed) and does not
        reduce stock again. Reusing a key with a different body is rejected (422).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              product_id: 1
              quantity: 2
      responses:
        "201":
          description: Order created with status pending (or the original order, on a replay).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Idempotent-Replayed:
              description: Present and "true" only when this is a replay of an earlier request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: >
            Body is not a JSON object, product_id is not an integer, or quantity
            is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: quantity must be a positive integer.
        "404":
          description: No product with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Product not found.
        "409":
          description: Requested quantity exceeds available stock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientStock"
        "429":
          description: >
            Rate limit exceeded: more than 10 POST /orders requests in 60 seconds
            from the same client IP (everyone behind one IP shares the budget).
            Allowed again after the number of seconds in Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimited"
        "422":
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders/{order_id}/complete:
    post:
      tags: [orders]
      summary: Mark a pending order as completed
      operationId: completeOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order is now completed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No order with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Order not found.
        "409":
          description: Order was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Order is already completed.

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen unique value (1-128 chars, e.g. a UUID) that makes a retry safe.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    XRequestID:
      description: Correlation ID, echoed from the request or generated by the server.
      schema:
        type: string

  schemas:
    Health:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string

    Product:
      type: object
      required: [id, name, category, price, stock]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        price:
          type: number
        stock:
          type: integer

    CreateOrderRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1

    Order:
      type: object
      required:
        [id, product_id, quantity, unit_price, total_price, status, created_at, product_name]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
        total_price:
          type: number
        status:
          type: string
          enum: [pending, completed]
        created_at:
          type: string
        product_name:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RateLimited:
      type: object
      required: [error, limit, window_seconds, retry_after_seconds]
      properties:
        error:
          type: string
        limit:
          type: integer
        window_seconds:
          type: integer
        retry_after_seconds:
          type: integer

    InsufficientStock:
      type: object
      required: [error, available_stock]
      properties:
        error:
          type: string
        available_stock:
          type: integer